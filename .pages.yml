# Konfiguracja Pages CMS (https://pagescms.org) — panel edycji strony Instytutu.
# Każda zmiana w panelu to commit w tym repozytorium; GitHub Actions przebudowuje stronę w ok. 2 minuty.

settings:
  commit:
    identity: user

media:
  input: public/pliki
  output: /pliki
  rename: safe

content:
  # ---------------------------------------------------------------- AKTUALNOŚCI
  - name: aktualnosci
    label: Aktualności
    type: collection
    path: src/content/aktualnosci
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [tytul, data, rodzaj, opublikowany]
      primary: tytul
      sort: data
      order: desc
    fields:
      - name: tytul
        label: Tytuł
        type: string
        required: true
      - name: data
        label: Data publikacji
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: opublikowany
        label: Opublikowany
        description: Odznaczone = podgląd. Wpis ma swój adres, ale nie pojawia się na listach, w wyszukiwarce ani w mapie strony.
        type: boolean
        default: true
      - name: rodzaj
        label: Rodzaj
        type: select
        default: ogloszenie
        options:
          values:
            - { name: ogloszenie, label: Ogłoszenie }
            - { name: wydarzenie, label: Wydarzenie }
            - { name: sukces, label: Sukces }
            - { name: kariera, label: Kariera }
      - name: dla
        label: Dla kogo
        type: select
        options:
          multiple: true
          values:
            - { name: studenci, label: Studenci }
            - { name: doktoranci, label: Doktoranci }
            - { name: pracownicy, label: Pracownicy }
            - { name: kandydaci, label: Kandydaci }
      - name: zajawka
        label: Zajawka (1–2 zdania na listę i stronę główną)
        type: text
      - name: zdjecie
        label: Zdjęcie główne
        type: image
        options:
          path: public/pliki/aktualnosci
      - name: zdjecie_opis
        label: Podpis / opis zdjęcia (np. kto jest na zdjęciu, autor)
        type: string
      - name: wyroznij_do
        label: Wyróżnij na stronie głównej do… (żółty pasek; puste = bez wyróżnienia)
        type: date
        options:
          format: yyyy-MM-dd
      - name: wydarzenie_poczatek
        label: "Wydarzenie: początek (puste = to nie jest wydarzenie)"
        type: date
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: wydarzenie_koniec
        label: "Wydarzenie: koniec (opcjonalnie)"
        type: date
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: wydarzenie_miejsce
        label: "Wydarzenie: miejsce (np. sala WS, Instytut Matematyczny UWr)"
        type: string
      - name: body
        label: Treść
        type: rich-text
        options:
          format: markdown
          path: public/pliki/aktualnosci
      - name: galeria
        label: Galeria zdjęć
        type: object
        list: true
        fields:
          - name: plik
            label: Zdjęcie
            type: image
            options:
              path: public/pliki/aktualnosci
          - name: podpis
            label: Podpis
            type: string
      - name: album
        label: Link do pełnego albumu (np. Google Photos, Flickr)
        type: string
      - name: zalaczniki
        label: Załączniki (PDF itp.)
        type: object
        list: true
        fields:
          - name: nazwa
            label: Nazwa wyświetlana
            type: string
          - name: plik
            label: Plik
            type: file
            options:
              path: public/pliki/aktualnosci
      - name: zaklad
        label: Zakład (opcjonalnie — wpis pojawi się też na stronie zakładu)
        type: select
        options:
          values:
            - { name: algebra-i-teoria-modeli, label: Algebra i teoria modeli }
            - { name: analiza-funkcjonalna, label: Analiza funkcjonalna }
            - { name: analiza-matematyczna, label: Analiza matematyczna }
            - { name: geometria, label: Geometria }
            - { name: rownania-rozniczkowe, label: Równania różniczkowe }
            - { name: teoria-mnogosci-i-topologia, label: Teoria mnogości i topologia }
            - { name: teoria-prawdopodobienstwa, label: Teoria prawdopodobieństwa }
            - { name: statystyka, label: Statystyka }
            - { name: dydaktyka, label: Pracownia Dydaktyki i Popularyzacji Matematyki }
      - name: tytul_en
        label: "EN: tytuł"
        type: string
      - name: zajawka_en
        label: "EN: zajawka"
        type: text
      - name: tresc_en
        label: "EN: treść (Markdown; puste = wersja angielska pokaże treść po polsku)"
        type: text

  # ---------------------------------------------------------------- OBRONY
  - name: obrony
    label: Obrony doktorskie
    type: collection
    path: src/content/obrony
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [kandydat, termin, opublikowany]
      primary: kandydat
      sort: termin
      order: desc
    fields:
      - { name: kandydat, label: Imię i nazwisko doktoranta, type: string, required: true }
      - { name: tytul_rozprawy, label: Tytuł rozprawy, type: string, required: true }
      - name: promotorzy
        label: Promotor / promotorzy
        type: string
        list: true
      - name: termin
        label: Termin obrony
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - { name: miejsce, label: Miejsce, type: string, default: "sala WS, Instytut Matematyczny UWr" }
      - name: data_ogloszenia
        label: Data ogłoszenia (pozycja na liście aktualności)
        type: date
        options:
          format: yyyy-MM-dd
      - name: opublikowany
        label: Opublikowany
        type: boolean
        default: true
      - name: w_aktualnosciach
        label: Pokaż też w aktualnościach
        type: boolean
        default: true
      - { name: zawiadomienie, label: Zawiadomienie o obronie (PDF), type: file, options: { path: public/pliki/obrony } }
      - { name: rozprawa, label: Rozprawa doktorska (PDF), type: file, options: { path: public/pliki/obrony } }
      - { name: streszczenie_pl, label: Streszczenie po polsku (PDF), type: file, options: { path: public/pliki/obrony } }
      - { name: streszczenie_en, label: Streszczenie po angielsku (PDF), type: file, options: { path: public/pliki/obrony } }
      - name: recenzje
        label: Recenzje
        type: object
        list: true
        fields:
          - { name: recenzent, label: "Recenzent (np. prof. dr hab. Jan Kowalski)", type: string }
          - { name: plik, label: Recenzja (PDF), type: file, options: { path: public/pliki/obrony } }
      - { name: bip, label: Link do ogłoszenia w BIP (opcjonalnie), type: string }
      - name: zaklad
        label: Zakład (opcjonalnie)
        type: select
        options:
          values:
            - { name: algebra-i-teoria-modeli, label: Algebra i teoria modeli }
            - { name: analiza-funkcjonalna, label: Analiza funkcjonalna }
            - { name: analiza-matematyczna, label: Analiza matematyczna }
            - { name: geometria, label: Geometria }
            - { name: rownania-rozniczkowe, label: Równania różniczkowe }
            - { name: teoria-mnogosci-i-topologia, label: Teoria mnogości i topologia }
            - { name: teoria-prawdopodobienstwa, label: Teoria prawdopodobieństwa }
            - { name: statystyka, label: Statystyka }
            - { name: dydaktyka, label: Pracownia Dydaktyki i Popularyzacji Matematyki }
      - name: body
        label: Dodatkowy opis (opcjonalnie)
        type: rich-text
        options:
          format: markdown

  # ---------------------------------------------------------------- SEMINARIA
  - name: seminaria
    label: Seminaria
    type: collection
    path: src/content/seminaria
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [nazwa, prowadzacy, aktywne]
      primary: nazwa
    fields:
      - { name: nazwa, label: Nazwa seminarium, type: string, required: true }
      - { name: nazwa_en, label: "EN: nazwa", type: string }
      - name: prowadzacy
        label: "Koordynator (imię i nazwisko jak w spisie pracowników; tytuł doda się sam)"
        description: "Termin i salę wpisuje się przy każdym referacie osobno."
        type: string
        list: true
      - { name: kontakt, label: E-mail kontaktowy (pod nazwiskiem koordynatora), type: string }
      - { name: strona, label: Zewnętrzna strona seminarium, type: string }
      - { name: archiwum, label: Link do archiwum referatów, type: string }
      - name: zaklad
        label: Zakład (można wybrać kilka)
        type: select
        options:
          multiple: true
          values:
            - { name: algebra-i-teoria-modeli, label: Algebra i teoria modeli }
            - { name: analiza-funkcjonalna, label: Analiza funkcjonalna }
            - { name: analiza-matematyczna, label: Analiza matematyczna }
            - { name: geometria, label: Geometria }
            - { name: rownania-rozniczkowe, label: Równania różniczkowe }
            - { name: teoria-mnogosci-i-topologia, label: Teoria mnogości i topologia }
            - { name: teoria-prawdopodobienstwa, label: Teoria prawdopodobieństwa }
            - { name: statystyka, label: Statystyka }
            - { name: dydaktyka, label: Pracownia Dydaktyki i Popularyzacji Matematyki }
      - { name: aktywne, label: Aktywne, type: boolean, default: true }
      - { name: opublikowany, label: Opublikowany, type: boolean, default: true }
      - name: body
        label: Opis (Markdown, wzory w $...$)
        type: code
        options:
          format: markdown

  - name: referaty
    label: Referaty seminaryjne
    description: Każde seminarium ma swój folder — dodaj referat w folderze właściwego seminarium.
    type: collection
    path: src/content/referaty
    format: yaml-frontmatter
    subfolders: true
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    view:
      fields: [tytul, prelegent, termin]
      primary: tytul
      sort: termin
      order: desc
    fields:
      - { name: tytul, label: Tytuł referatu, type: string, required: true }
      - { name: prelegent, label: Prelegent, type: string, required: true }
      - { name: afiliacja, label: Afiliacja, type: string }
      - name: termin
        label: Termin
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - { name: sala, label: Sala, type: string }
      - name: pliki
        label: Pliki (slajdy itp.)
        type: object
        list: true
        fields:
          - { name: nazwa, label: Nazwa, type: string }
          - { name: plik, label: Plik, type: file, options: { path: public/pliki/seminaria } }
      - { name: opublikowany, label: Opublikowany, type: boolean, default: true }
      - name: body
        label: Streszczenie (Markdown, wzory w $...$)
        type: code
        options:
          format: markdown

  # ---------------------------------------------------------------- KIERUNKI STUDIÓW
  - name: kierunki
    label: Kierunki studiów
    description: "Strona kierunku (np. /studia/matematyka). Pola są ułożone tak jak sekcje na stronie: ① nagłówek, ② dla kandydata, ③ dla studenta, ④ dokumenty, ⑤ kontakt, ⑥ wersja angielska, ⑦ menu i strona główna. Puste sekcje się nie wyświetlają. Specjalności edytuje się w sekcji „Specjalności” — kafelki na stronie kierunku budują się same."
    type: collection
    path: src/content/kierunki
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [nazwa, kolejnosc, opublikowany]
      primary: nazwa
    fields:
      # ① Nagłówek
      - { name: nazwa, label: "① Nazwa kierunku", type: string, required: true }
      - { name: podtytul, label: "① Nadtytuł (np. Studia I i II stopnia)", type: string }
      - { name: opis, label: "① Jedno zdanie pod nazwą", type: text }
      - name: fakty
        label: "① Liczby w nagłówku (np. 3 lata — studia I stopnia)"
        type: object
        list: true
        fields:
          - { name: wartosc, label: Wartość, type: string }
          - { name: etykieta, label: Opis, type: string }
          - { name: etykieta_en, label: "EN: opis", type: string }
      - name: przyciski
        label: "① Przyciski pod opisem (np. Rekrutacja)"
        type: object
        list: true
        fields:
          - { name: etykieta, label: Etykieta, type: string }
          - { name: adres, label: "Adres (link)", type: string }
          - { name: etykieta_en, label: "EN: etykieta", type: string }
      - { name: opublikowany, label: Opublikowany, type: boolean, default: true }
      # ② Dla kandydata
      - name: body
        label: "② O kierunku (tekst główny)"
        type: rich-text
        options:
          format: markdown
      - name: dlaczego
        label: "② Dlaczego warto (kafelki)"
        type: object
        list: true
        fields:
          - { name: tytul, label: Tytuł, type: string }
          - { name: opis, label: Opis, type: text }
          - name: ikona
            label: Ikona
            type: select
            options:
              values: [flaga, czapka, ludzie, zewnetrzny, kalendarz, tablica, zegar, plik]
          - { name: tytul_en, label: "EN: tytuł", type: string }
          - { name: opis_en, label: "EN: opis", type: text }
      - { name: kariera, label: "② Po studiach (Markdown)", type: text }
      - name: faq
        label: "② Pytania i odpowiedzi"
        type: object
        list: true
        fields:
          - { name: pytanie, label: Pytanie, type: string }
          - { name: odpowiedz, label: "Odpowiedź (Markdown)", type: text }
          - { name: pytanie_en, label: "EN: pytanie", type: string }
          - { name: odpowiedz_en, label: "EN: odpowiedź", type: text }
      # ③ Dla studenta
      - name: etapy
        label: "③ Jak wyglądają studia — oś semestrów (co roku sprawdź z nowym programem)"
        description: "Każdy etap to jeden punkt na osi. Stopień I i II pokazują się jako dwie ścieżki, III — jako ścieżka doktoranta."
        type: object
        list: true
        fields:
          - name: stopien
            label: Stopień
            type: select
            options:
              values: [I, II, III]
          - { name: kiedy, label: "Kiedy (np. Semestry 1–2)", type: string }
          - { name: tytul, label: Tytuł etapu, type: string }
          - { name: opis, label: Opis, type: text }
          - { name: termin, label: "Ważny termin (opcjonalnie)", type: string }
          - { name: formularz, label: "Formularz (np. Formularz C2)", type: string }
          - { name: formularz_adres, label: Link do formularza, type: string }
          - { name: kiedy_en, label: "EN: kiedy", type: string }
          - { name: tytul_en, label: "EN: tytuł", type: string }
          - { name: opis_en, label: "EN: opis", type: text }
          - { name: termin_en, label: "EN: termin", type: string }
      - name: programy
        label: "③ Programy studiów (zakładki; nowy program = nowa pozycja z rokiem „od”)"
        description: "Student wybiera rok rozpoczęcia studiów i widzi program, którego zakres lat go obejmuje. Przy nowym programie dodaj pozycję, a staremu wpisz „do roku”."
        type: object
        list: true
        fields:
          - { name: nazwa, label: "Nazwa zakładki (np. Nowy program od 2026/27)", type: string }
          - { name: dotyczy, label: Kogo dotyczy, type: string }
          - { name: od_roku, label: "Dla rozpoczynających studia od roku (np. 2026)", type: number }
          - { name: do_roku, label: "… do roku (puste = bez końca)", type: number }
          - name: dokumenty
            label: Dokumenty
            type: object
            list: true
            fields:
              - { name: nazwa, label: Nazwa, type: string }
              - { name: wgraj, label: "Wgraj plik (PDF, DOCX…)", type: file, options: { path: public/pliki/studia } }
              - { name: plik, label: "…albo link (np. do BIP) — gdy nie wgrywasz pliku", type: string }
              - { name: opis, label: Krótki opis (opcjonalnie), type: string }
              - { name: nazwa_en, label: "EN: nazwa", type: string }
              - { name: opis_en, label: "EN: krótki opis", type: string }
          - { name: nazwa_en, label: "EN: nazwa zakładki", type: string }
          - { name: dotyczy_en, label: "EN: kogo dotyczy", type: string }
      - name: terminy
        label: "③ Terminy i formularze (tabela)"
        type: object
        list: true
        fields:
          - { name: co, label: Sprawa, type: string }
          - { name: kogo, label: Kogo dotyczy, type: string }
          - { name: termin, label: Termin, type: string }
          - { name: formularz, label: "Formularz (np. C2)", type: string }
          - { name: formularz_adres, label: Link do formularza, type: string }
          - { name: co_en, label: "EN: sprawa", type: string }
          - { name: kogo_en, label: "EN: kogo dotyczy", type: string }
          - { name: termin_en, label: "EN: termin", type: string }
      - { name: praktyki, label: "③ Praktyki pedagogiczne (Markdown; puste = sekcja ukryta)", type: text }
      # ④ Dokumenty
      - name: praktyki_dokumenty
        label: "④ Dokumenty praktyk"
        type: object
        list: true
        fields:
          - { name: nazwa, label: Nazwa, type: string }
          - { name: wgraj, label: "Wgraj plik (PDF, DOCX…)", type: file, options: { path: public/pliki/studia } }
          - { name: plik, label: "…albo link — gdy nie wgrywasz pliku", type: string }
          - { name: nazwa_en, label: "EN: nazwa", type: string }
      - name: akty
        label: "④ Akty prawne (regulaminy, uchwały, zarządzenia)"
        type: object
        list: true
        fields:
          - { name: nazwa, label: Nazwa, type: string }
          - { name: wgraj, label: "Wgraj plik (PDF)", type: file, options: { path: public/pliki/studia } }
          - { name: plik, label: "…albo link (np. do BIP) — gdy nie wgrywasz pliku", type: string }
          - { name: nazwa_en, label: "EN: nazwa", type: string }
      # ⑤ Kontakt
      - name: kontakt
        label: "⑤ Kontakt"
        type: object
        list: true
        fields:
          - { name: rola, label: "Rola (np. Sekretariat dydaktyczny)", type: string }
          - { name: osoba, label: Osoba, type: string }
          - { name: email, label: E-mail, type: string }
          - { name: telefon, label: "Telefon (tylko sekretariat, dziekanat, administracja)", type: string }
          - { name: pokoj, label: Pokój, type: string }
          - { name: rola_en, label: "EN: rola", type: string }
      # ⑥ Wersja angielska
      - { name: nazwa_en, label: "⑥ EN: nazwa kierunku", type: string }
      - { name: podtytul_en, label: "⑥ EN: nadtytuł", type: string }
      - { name: opis_en, label: "⑥ EN: zdanie pod nazwą", type: text }
      - { name: tresc_en, label: "⑥ EN: o kierunku (Markdown)", type: text }
      - { name: praktyki_en, label: "⑥ EN: praktyki (Markdown)", type: text }
      - { name: kariera_en, label: "⑥ EN: po studiach (Markdown)", type: text }
      # ⑦ Menu i strona główna
      - { name: kolejnosc, label: "⑦ Kolejność (w menu „Studia” i w kafelkach na stronie głównej; 1 = pierwszy)", type: number }
      - { name: w_menu, label: "⑦ Pokaż w menu „Studia”", type: boolean, default: true }
      - { name: menu_etykieta, label: "⑦ Krótka nazwa w menu i na kafelku (puste = pełna nazwa)", type: string }
      - { name: menu_etykieta_en, label: "⑦ EN: krótka nazwa", type: string }
      - { name: na_stronie_glownej, label: "⑦ Pokaż kafelek na stronie głównej (sekcja Studia)", type: boolean, default: true }
      - { name: kafelek_poziom, label: "⑦ Kafelek: napis nad nazwą (np. Kierunek, III stopień)", type: string }
      - { name: kafelek_poziom_en, label: "⑦ EN: napis nad nazwą", type: string }
      - { name: kafelek_opis, label: "⑦ Kafelek: jedno krótkie zdanie (puste = zdanie spod nazwy)", type: string }
      - { name: kafelek_opis_en, label: "⑦ EN: zdanie na kafelku", type: string }

  # ---------------------------------------------------------------- SPECJALNOŚCI
  - name: specjalnosci
    label: Specjalności
    description: "Podstrona specjalności, np. /studia/matematyka/analiza-danych. Kafelek na stronie kierunku buduje się z tych samych danych (nazwa, skrót, zdanie pod nazwą, opiekunowie, zakład) — wszystko wpisujesz tylko tutaj."
    type: collection
    path: src/content/specjalnosci
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [nazwa, kierunek, opublikowany]
      primary: nazwa
    fields:
      - { name: nazwa, label: Nazwa specjalności, type: string, required: true }
      - { name: kierunek, label: "Kierunek (nazwa pliku z sekcji Kierunki, np. matematyka)", type: string, default: matematyka }
      - { name: kolejnosc, label: "Kolejność kafelka na stronie kierunku (1 = pierwszy)", type: number }
      - { name: na_stronie_kierunku, label: Pokaż kafelek na stronie kierunku, type: boolean, default: true }
      - { name: bez_podstrony, label: "Bez własnej podstrony (tylko kafelek, np. specjalność wygaszana)", type: boolean, default: false }
      - { name: kafelek_dla_kogo, label: "Kafelek: „Dla kogo” — jedno zdanie", type: text }
      - { name: kafelek_kariera, label: "Kafelek: „Po studiach” — jedno zdanie", type: text }
