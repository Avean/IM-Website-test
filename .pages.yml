  # ---------------------------------------------------------------- ZAKŁADY
  - name: zaklady
    label: Zakłady
    description: Skład zakładu bierze się z pola „Zakład” w kartach pracowników; seminaria, granty i konferencje — z ich pola „Zakład”.
    type: collection
    path: src/content/zaklady
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [nazwa, kierownik]
      primary: nazwa
      sort: kolejnosc
    fields:
      - { name: nazwa, label: Pełna nazwa, type: string, required: true }
      - { name: nazwa_krotka, label: "Krótka nazwa (np. Geometria)", type: string }
      - { name: kierownik, label: "Kierownik (imię i nazwisko jak w spisie pracowników)", type: string }
      - { name: telefon, label: "Telefon zakładu (tylko numer ogólny, np. sekretariat — nie podajemy numerów pracowników naukowych)", type: string }
      - { name: opis, label: Jedno zdanie o zakładzie, type: text }
      - name: obszary
        label: Obszary badań (tagi)
        type: string
        list: true
      - { name: strona, label: Zewnętrzna strona zespołu, type: string }
      - { name: zdjecie, label: Zdjęcie zespołu, type: image, options: { path: public/pliki/zaklady } }
      - { name: zdjecie_opis, label: Podpis zdjęcia, type: string }
      - { name: kolejnosc, label: Kolejność na liście, type: number }
      - { name: opublikowany, label: Opublikowany, type: boolean, default: true }
      - name: body
        label: Opis zakładu (czym się zajmuje, historia, tematy prac dla studentów)
        type: rich-text
        options:
          format: markdown
          path: public/pliki/zaklady
      - { name: nazwa_en, label: "EN: pełna nazwa", type: string }
      - { name: nazwa_krotka_en, label: "EN: krótka nazwa", type: string }
      - { name: opis_en, label: "EN: jedno zdanie", type: text }
      - name: obszary_en
        label: "EN: obszary badań"
        type: string
        list: true
      - { name: tresc_en, label: "EN: opis (Markdown)", type: text }

