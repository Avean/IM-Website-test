name: Budowanie i publikacja strony

on:
  push:
    branches: [main]
  # Codzienna przebudowa: „Najbliższe wydarzenia”, „Seminaria w tym tygodniu”
  # i wyróżnienia na stronie głównej zmieniają się z upływem czasu.
  schedule:
    - cron: '7 3 * * *'
    - cron: '7 11 * * *'
  # Sygnał z repozytoriów seminariów (nowy referat) — patrz README.
  repository_dispatch:
    types: [seminaria, przebuduj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalacja zależności
        run: npm install --no-audit --no-fund

      - name: Konfiguracja GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Budowanie strony
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
