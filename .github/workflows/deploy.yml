name: Budowanie i publikacja strony

on:
  push:
    branches: [main]
  # Codzienna przebudowa: „Najbliższe wydarzenia”, „Seminaria w tym tygodniu”
  # i wyróżnienia na stronie głównej zmieniają się z upływem czasu.
  schedule:
    - cron: '7 3 * * *'
    - cron: '7 11 * * *'
  # Sygnał z repozytoriów seminariów (nowy referat) — patrz README.
  repository_dispatch:
    types: [seminaria, przebuduj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalacja zależności
        run: npm install --no-audit --no-fund

      - name: Konfiguracja GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      # Adres i ścieżkę bazową podaje configure-pages (działa też z domeną UWr).
      # Gdy Pages nie jest jeszcze włączone, budujemy z ustawieniami domyślnymi z astro.config.mjs.
      - name: Budowanie strony
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            export SITE_URL="${{ steps.pages.outputs.origin }}"
            export BASE_PATH="${{ steps.pages.outputs.base_path }}"
          fi
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            # Ostatnie linie logu jako adnotacja błędu (widoczna w podsumowaniu przebiegu).
            msg=$(tail -c 6000 build.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Błąd budowania::${msg}"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
