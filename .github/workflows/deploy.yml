name: Budowanie i publikacja strony

on:
  push:
    branches: [main]
  # Codzienna przebudowa: „Najbliższe wydarzenia”, „Seminaria w tym tygodniu”
  # i wyróżnienia na stronie głównej zmieniają się z upływem czasu.
  schedule:
    - cron: '7 3 * * *'
    - cron: '7 11 * * *'
  # Sygnał z repozytoriów seminariów (nowy referat) — patrz README.
  repository_dispatch:
    types: [seminaria, przebuduj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalacja zależności
        run: npm install --no-audit --no-fund

      - name: Konfiguracja GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      # Adres i ścieżkę bazową podaje configure-pages (działa też z domeną UWr).
      # Gdy Pages nie jest jeszcze włączone, budujemy z ustawieniami domyślnymi z astro.config.mjs.
      - name: Budowanie strony
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            export SITE_URL="${{ steps.pages.outputs.origin }}"
            export BASE_PATH="${{ steps.pages.outputs.base_path }}"
          fi
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            # Ostatnie linie logu jako adnotacja błędu (widoczna w podsumowaniu przebiegu).
            msg=$(tail -c 6000 build.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Błąd budowania::${msg}"
            exit 1
          fi
          # Ostrzeżenia z budowania — też jako adnotacja.
          warn=$(sed -e 's/\x1b\[[0-9;]*m//g' build.log | grep -iE 'warn|error|failed|not found' | head -40 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
          if [ -n "$warn" ]; then echo "::warning title=Ostrzeżenia budowania::${warn}"; fi
          # Statystyka: ile stron powstało.
          echo "::notice title=Wynik budowania::$(find dist -name '*.html' | wc -l) stron HTML, $(du -sh dist | cut -f1)"

      # Warianty wyglądu do porównania: każda gałąź wariant-<nazwa> jest budowana obok głównej strony pod
      # <adres strony>/warianty/<nazwa>/ (bez PDF-ów i innych dokumentów, żeby paczka nie rosła). Na wszystkich
      # stronach (głównej i wariantach) w lewym dolnym rogu pojawia się przełącznik wariantów — dodawany tu, przy
      # publikacji, nie w kodzie strony. Po wyborze wariantu wystarczy usunąć gałęzie wariant-* (krok się pomija).
      # Błąd budowania wariantu nie zatrzymuje publikacji głównej strony.
      - name: Warianty wyglądu (gałęzie wariant-*)
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        env:
          SITE0: ${{ steps.pages.outputs.origin }}
          BASE0: ${{ steps.pages.outputs.base_path }}
        run: |
          WARIANTY=$(git ls-remote --heads origin 'wariant-*' | sed 's#.*refs/heads/wariant-##' | sort)
          if [ -z "$WARIANTY" ]; then echo "Brak gałęzi wariant-*"; exit 0; fi
          ok=""
          for n in $WARIANTY; do
            d="$RUNNER_TEMP/wariant-$n"
            rm -rf "$d"
            git fetch -q --depth 1 origin "wariant-$n" && git worktree add -q --detach "$d" FETCH_HEAD || continue
            if (cd "$d" && npm install --no-audit --no-fund --prefer-offline > install.log 2>&1 \
                && SITE_URL="$SITE0" BASE_PATH="$BASE0/warianty/$n" npm run build > build.log 2>&1); then
              find "$d/dist" -type f \( -iname '*.pdf' -o -iname '*.zip' -o -iname '*.doc' -o -iname '*.docx' -o -iname '*.ppt*' -o -iname '*.xls*' \) -delete
              mkdir -p "dist/warianty/$n"
              cp -r "$d/dist/." "dist/warianty/$n/"
              ok="$ok $n"
              echo "::notice title=Wariant $n::$(find "$d/dist" -name '*.html' | wc -l) stron HTML, $(du -sh "$d/dist" | cut -f1)"
            else
              echo "::warning title=Wariant $n się nie zbudował::$(tail -c 1500 "$d/build.log" 2>/dev/null | tr '\n' ' ')"
            fi
          done
          [ -z "$ok" ] && exit 0
          linki=""
          for n in obecna $(for x in zwarta portal redakcyjna; do case " $ok " in *" $x "*) echo "$x";; esac; done); do
            case "$n" in obecna) e="Obecna"; w="";; zwarta) e="Zwarta"; w="$n";; portal) e="Portal"; w="$n";; redakcyjna) e="Redakcyjna"; w="$n";; *) e="$n"; w="$n";; esac
            linki="$linki<a data-wariant=\"$w\" href=\"$BASE0/\">$e</a>"
          done
          export PASEK="<div class=\"wr-pasek\" data-pagefind-ignore role=\"navigation\" aria-label=\"Warianty wyglądu (podgląd)\"><span>Wariant:</span>$linki</div><style>.wr-pasek{position:fixed;left:10px;bottom:10px;z-index:9999;display:flex;flex-wrap:wrap;align-items:center;gap:2px;max-width:calc(100vw - 20px);padding:4px;border-radius:999px;background:#0b1630;box-shadow:0 4px 18px rgb(0 0 0/.35);font:700 12px/1 system-ui,sans-serif}.wr-pasek span{padding:0 6px 0 8px;color:#c4cee0}.wr-pasek a{padding:8px 10px;border-radius:999px;color:#fff;text-decoration:none}.wr-pasek a:hover{background:rgb(255 255 255/.14)}.wr-pasek a[aria-current]{background:#f2a33a;color:#101828}</style><script>(function(){var b='$BASE0',p=location.pathname,s=p.slice(b.length),m=s.match(/^\\/warianty\\/([^\\/]+)/),c=m?m[1]:'',r=(m?s.slice(m[0].length):s)||'/';document.querySelectorAll('.wr-pasek a').forEach(function(a){var w=a.getAttribute('data-wariant');a.href=b+(w?'/warianty/'+w:'')+r+location.hash;if(w===c)a.setAttribute('aria-current','true');});})();</script>"
          find dist -name '*.html' -print0 | xargs -0 perl -0pi -e 's/<\/body>/$ENV{PASEK}<\/body>/'
          echo "::notice title=Warianty::opublikowane:$ok"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
